name: Сообщить об ошибке
description: Воспроизводимый дефект Mathforces без персональных данных
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Не прикладывайте `.env`, cookie, дампы БД и реальные решения участников.
  - type: textarea
    id: description
    attributes:
      label: Что произошло
      description: Опишите фактическое и ожидаемое поведение.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть…
        2. Нажать…
        3. Увидеть…
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      placeholder: ОС, браузер, localhost/LAN/Docker
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Безопасные логи или скриншоты
      render: shell
